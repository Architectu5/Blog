{% extends 'posts/base.html' %}

{% block title %}Удалить пост{% endblock %}

{% block content %}
    <h2>Удалить «{{ post.title }}»?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'post_detail' post.id %}">Отмена</a>
    </form>
{% endblock %}
